<svg width="680" height="530" viewBox="0 0 680 530" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Three-layer architecture information flow</title>
<desc>A vertical diagram showing how information flows between the User Interface, Business Logic, and Technical Services layers down to the MySQL database, with requests flowing down and results flowing back up.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="140" y="40" width="400" height="70" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="340" y="65" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">User interface</text>
<text x="340" y="88" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">JavaFX views, buttons, text fields</text>

<line x1="270" y1="110" x2="270" y2="170" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="410" y1="170" x2="410" y2="110" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="140" y="170" width="400" height="70" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="340" y="195" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Business logic</text>
<text x="340" y="218" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Controller, sentence generator</text>

<line x1="270" y1="240" x2="270" y2="300" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="410" y1="300" x2="410" y2="240" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="140" y="300" width="400" height="70" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="340" y="325" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">Technical services</text>
<text x="340" y="348" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">Word repository, file import</text>

<line x1="270" y1="370" x2="270" y2="430" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="410" y1="430" x2="410" y2="370" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="140" y="430" width="400" height="60" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340" y="450" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">MySQL database</text>
<text x="340" y="472" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Words, word pairs, imported files</text>

<text x="230" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">calls down</text>
<text x="450" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">returns up</text>
<text x="230" y="280" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">calls down</text>
<text x="450" y="280" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">returns up</text>
<text x="230" y="410" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">reads/writes</text>
<text x="450" y="410" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">query results</text>
</svg>
